taxonomy_definitions:
  mutability:
    I: immutable
    PS: path-dependent short_or_medium_term_change_only
    PL: path-dependent_long_term_change_only
    M: directly_or_moderately_mutable
    N: not_behaviorally_changeable
    P: partially_mutable_or_lender_structured
  verifiability:
    Y: yes
    P: partial
    N: no
  correctability:
    Y: yes
    P: partial
    N: no
  sensitivity:
    S: directly_sensitive_or_protected_like
    P: proxy_sensitive_or_socially_sensitive
    N: not_obviously_sensitive
  principal_reason:
    High: usually_suitable_for_adverse_action_principal_reason
    Medium: usable_with_translation_or_care
    Low: should_usually_not_be_used_directly

global_policy:
  primary_track:
    remove_identifiers: true
    exclude_direct_sensitive_features_where_feasible: true
    retain_sensitive_features_for_audit: true
    principal_reasons_max_count: 4
  audit_track:
    broader_feature_retention: true
    use_for_fairness_and_failure_analysis: true

