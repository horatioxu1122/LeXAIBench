        review_status: "reviewed by the authors"
      total_units:
        plain_meaning: number_of_housing_units
        mutability: P
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Low
        rationale: "Number of dwelling units, a fixed attribute of the property that the applicant knows (V=Y); a misrecorded count can be restated with property documents (C=Y; v1 P), and changing it means choosing another property (M=P); not a personal characteristic (S=N)."
        legal_basis: "Reg C 12 CFR 1003.4(a)(31)"
        review_status: "reviewed by the authors"
      income:
        plain_meaning: applicant_income_in_thousands
        mutability: PL
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: High
        rationale: "Gross annual income relied on, documented by the applicant's own pay and tax records (V=Y) and correctable with that documentation (C=Y; v1 P); income level is a legitimate factor, but Reg B protects public-assistance income and restricts discounting income by source, so it is labeled socially sensitive (S=P); the manuscript's example of a feature mutable only at high cost, matching give_me_some_credit MonthlyIncome (M=PL; v1 M)."
        legal_basis: "Reg C 12 CFR 1003.4(a)(10)(iii); ECOA 15 U.S.C. 1691(a)(2); Reg B 12 CFR 1002.6(b)(5)"
