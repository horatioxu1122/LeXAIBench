      debt_to_income_ratio:
        plain_meaning: debt_to_income_ratio_band
        mutability: M
        verifiability: P
        correctability: P
        sensitivity: "N"
        principal_reason: High
        rationale: "Debt-to-income ratio computed by the lender from documented income and bureau-reported debts, so the applicant can check it only with the lender's and bureau's records (V=P; v1 Y); the inputs can be documented or disputed, but the computation is the lender's (C=P); not a personal characteristic (S=N); paying down debt or borrowing less lowers it (M=M)."
