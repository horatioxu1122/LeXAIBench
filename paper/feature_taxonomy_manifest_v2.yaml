        rationale: "County of the property, known from the applicant's address (V=Y); the county code is assigned by the institution's geocoding of that address, so an error is corrected at the institution's discretion after the address is restated (C=P; v1 N), as for census_tract; geography is a recognized proxy for race and national origin (redlining), labeled P (S=P) and now kept in the primary track to be analyzed; moving is not a legitimate recourse action (M=N)."
        legal_basis: "FHA 42 U.S.C. 3605; ECOA 15 U.S.C. 1691(a)(1) (geographic proxy concern); Reg C 12 CFR 1003.4(a)(9)(ii)"
