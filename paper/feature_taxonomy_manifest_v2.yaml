        sensitivity: "N"
        principal_reason: Medium
        rationale: "Purchase, refinance, home-improvement or other purpose stated on the application (V=Y) and restatable (C=Y; v1 P); a transaction characteristic, not a protected characteristic or recognized proxy (S=N; v1 P); set by the applicant's need (M=P)."
