  ny_courts_pretrial:
    target: pretrial_release_outcome
    target_positive_label: released
    target_negative_label: detained
    legal_regime: "New York pretrial securing-order decisions (N.Y. Crim. Proc. Law art. 510). The subject is a criminal defendant; ECOA and the FCRA do not apply. Protected characteristics follow equal-protection doctrine (U.S. Const. amend. XIV; N.Y. Const. art. I, sec. 11)."
    primary_track_excluded_features:
      - gender
      - race
      - ethnicity
    audit_track_excluded_features: []
    features:
      gender:
        plain_meaning: gender_from_arrest_report
        mutability: I
        verifiability: P
        correctability: P
        sensitivity: S
        principal_reason: Low
        rationale: "Gender as recorded on the arrest report, so the defendant can confirm the recorded value only from the agency record (V=P; v1 Y) and a misrecording is corrected at the agency's discretion (C=P); sex classifications receive heightened equal-protection scrutiny (S=S); not actionable (M=I)."
        legal_basis: "U.S. Const. amend. XIV, sec. 1 (Equal Protection)"
        review_status: "reviewed by the authors"
      race:
        plain_meaning: race_from_arrest_report
        mutability: I
        verifiability: P
        correctability: P
        sensitivity: S
        principal_reason: Low
        rationale: "Race as recorded on the arrest report, which the defendant can confirm only from the agency record (V=P) and which is corrected at the agency's discretion (C=P); a suspect classification under equal protection (S=S); immutable (M=I)."
        legal_basis: "U.S. Const. amend. XIV, sec. 1 (Equal Protection); N.Y. Const. art. I, sec. 11"
        review_status: "reviewed by the authors"
      ethnicity:
        plain_meaning: ethnicity_from_arrest_report
        mutability: I
        verifiability: P
        correctability: P
        sensitivity: S
        principal_reason: Low
        rationale: "Ethnicity (Hispanic origin) as recorded on the arrest report, which the defendant can confirm only from the agency record (V=P) and which is corrected at the agency's discretion (C=P); ethnicity and national origin are suspect classifications under equal protection (S=S); immutable (M=I)."
        legal_basis: "U.S. Const. amend. XIV, sec. 1 (Equal Protection); N.Y. Const. art. I, sec. 11"
        review_status: "reviewed by the authors"
      age_at_arrest:
        plain_meaning: age_at_arrest
        mutability: I
        verifiability: P
        correctability: P
        sensitivity: P
        principal_reason: Low
        rationale: "Age at arrest, computed by the agency from the date of birth recorded on the arrest report and the arrest date, so, like gender from the same record, the defendant can confirm the recorded value only from the agency record (V=P; v1 Y) and a misrecorded date of birth is corrected at the agency's discretion (C=P; v1 N); immutable (M=I); age is not a suspect classification under equal protection and we found no statute barring its use in securing-order decisions, so it is labeled socially sensitive rather than protected (S=P; v1 S) and now stays in the primary track, a contested choice the authors should confirm."
        legal_basis: "Massachusetts Bd. of Retirement v. Murgia, 427 U.S. 307 (1976) (age is not a suspect class under federal equal protection doctrine); N.Y. Const. art. I, sec. 11, as revised in 2025 (age is among the grounds of its civil rights clause)"
        review_status: "reviewed by the authors"
      county_name:
        plain_meaning: county_name
        mutability: "N"
        verifiability: "Y"
        correctability: P
        sensitivity: P
        principal_reason: Low
        rationale: "County of the arraigning court, shown on the defendant's court papers (V=Y); a court-recorded institutional fact whose misrecording the court corrects at its discretion (C=P; v1 N), not actionable (M=N); geography is a recognized proxy for race and ethnicity (S=P), now kept in the primary track to be analyzed (v1 excluded it)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      court_type:
        plain_meaning: court_type
        mutability: "N"
        verifiability: "Y"
        correctability: P
        sensitivity: P
        principal_reason: Low
        rationale: "Type of arraigning court, shown on court papers (V=Y); a court-recorded institutional assignment whose misrecording the court corrects at its discretion (C=P; v1 N), not actionable (M=N); it tracks locality (for example, New York City courts versus town and village courts), so it is labeled a geographic proxy (S=P), a judgment to confirm against the source categories."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      arrest_type:
        plain_meaning: custody_or_desk_appearance_ticket_status
        mutability: P
        verifiability: "Y"
        correctability: P
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Custodial arrest or desk appearance ticket, which the defendant knows and holds paperwork for (V=Y); the choice is made by police, so correction of the record depends on the agency (C=P) and the defendant has limited influence (M=P); a procedural fact, not a personal characteristic (S=N)."
        legal_basis: "N.Y. Crim. Proc. Law 150.10, 150.20"
        review_status: "reviewed by the authors"
      top_charge_at_arraign:
        plain_meaning: top_charge_at_arraignment
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Top charge in the accusatory instrument served on the defendant (V=Y), which counsel can challenge by motion to dismiss or reduce (C=Y); the central statutory factor in the securing-order decision, not a personal characteristic (S=N); not changeable by the defendant (M=N)."
        legal_basis: "N.Y. Crim. Proc. Law 510.10(1)(b) (charges as a factor); 170.30, 210.20 (motions to dismiss or reduce)"
        review_status: "reviewed by the authors"
      top_severity_at_arraign:
        plain_meaning: top_charge_severity_at_arraignment
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Severity level (felony, misdemeanor or violation) of the top charge, read from the accusatory instrument (V=Y) and changed when the charge is dismissed or reduced on motion (C=Y); a statutory factor, not a personal characteristic (S=N); not changeable by the defendant (M=N)."
        legal_basis: "N.Y. Crim. Proc. Law 510.10(1)(b) (charges as a factor); 170.30, 210.20 (motions to dismiss or reduce)"
        review_status: "reviewed by the authors"
      top_charge_weight_at_arraign:
        plain_meaning: top_charge_weight_at_arraignment
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Offense class of the top charge (for example, class A misdemeanor), read from the accusatory instrument (V=Y) and changed when the charge is dismissed or reduced on motion (C=Y); a statutory factor, not a personal characteristic (S=N); not changeable by the defendant (M=N)."
        legal_basis: "N.Y. Crim. Proc. Law 510.10(1)(b) (charges as a factor); 170.30, 210.20 (motions to dismiss or reduce)"
        review_status: "reviewed by the authors"
      top_charge_at_arraign_violent_felony_ind:
        plain_meaning: violent_felony_indicator_for_top_arraignment_charge
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Whether the top charge is a violent felony offense as defined in the Penal Law, determined from the accusatory instrument (V=Y) and changed when the charge is dismissed or reduced on motion (C=Y); a statutory factor in the securing-order decision, not a personal characteristic (S=N); not changeable by the defendant (M=N)."
        legal_basis: "N.Y. Penal Law 70.02; N.Y. Crim. Proc. Law 510.10; 170.30, 210.20 (motions to dismiss or reduce)"
        review_status: "reviewed by the authors"
      arraign_charge_category:
        plain_meaning: grouped_arraignment_charge_category
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Grouped category of the top arraignment charge assigned by the data producer, derivable from the accusatory instrument (V=Y) and changed when the charge is dismissed or reduced on motion (C=Y); a charge-based factor, not a personal characteristic (S=N); not changeable by the defendant (M=N)."
        legal_basis: "N.Y. Crim. Proc. Law 510.10(1)(b) (charges as a factor); 170.30, 210.20 (motions to dismiss or reduce)"
        review_status: "reviewed by the authors"
      representation_at_securing_order:
        plain_meaning: attorney_assigned_by_arraignment
        mutability: P
        verifiability: "Y"
        correctability: P
        sensitivity: "N"
        principal_reason: Low
        rationale: "Whether the defendant had counsel when the securing order was set, which the defendant knows (V=Y); counsel is assigned by the court, so correction of the record depends on the court (C=P, M=P); a procedural fact, not a personal characteristic (S=N), and unsuitable as a reason for a securing order (PR=Low)."
        legal_basis: "N.Y. Crim. Proc. Law 170.10, 180.10 (right to counsel at arraignment)"
        review_status: "reviewed by the authors"
      prior_vfo_cnt:
        plain_meaning: count_of_prior_violent_felony_convictions
        mutability: "N"
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Count of prior violent felony convictions taken from the state criminal-history record, which the defendant can check only by obtaining that record (V=P; v1 Y); New York has a record-review procedure for challenging inaccurate entries (C=Y); a statutory securing-order factor rather than a protected characteristic (S=N), though it reflects enforcement disparities that the audit analyses address; fixed history (M=N)."
        legal_basis: "N.Y. Crim. Proc. Law 510.10(1)(c) (criminal conviction record as a factor); N.Y. Penal Law 70.02; the correctability label is set in the authors' review"
        review_status: "reviewed by the authors"
      prior_nonvfo_cnt:
        plain_meaning: count_of_prior_nonviolent_felony_convictions
        mutability: "N"
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Count of prior non-violent felony convictions taken from the state criminal-history record, which the defendant can check only by obtaining that record (V=P; v1 Y); New York has a record-review procedure for challenging inaccurate entries (C=Y); a statutory securing-order factor rather than a protected characteristic (S=N), though it reflects enforcement disparities that the audit analyses address; fixed history (M=N)."
        legal_basis: "N.Y. Crim. Proc. Law 510.10(1)(c) (criminal conviction record as a factor); the correctability label is set in the authors' review"
        review_status: "reviewed by the authors"
      prior_misd_cnt:
        plain_meaning: count_of_prior_misdemeanor_convictions
        mutability: "N"
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Count of prior misdemeanor convictions taken from the state criminal-history record, which the defendant can check only by obtaining that record (V=P; v1 Y); New York has a record-review procedure for challenging inaccurate entries (C=Y); a statutory securing-order factor rather than a protected characteristic (S=N), though it reflects enforcement disparities that the audit analyses address; fixed history (M=N)."
        legal_basis: "N.Y. Crim. Proc. Law 510.10(1)(c) (criminal conviction record as a factor); the correctability label is set in the authors' review"
        review_status: "reviewed by the authors"

