        rationale: "Applicant age band: a prohibited basis under ECOA for all credit, including mortgages, although age is not a Fair Housing Act protected class (S=S); known to the applicant (V=Y), not actionable (M=I), and computed from the date of birth the applicant states, which can be restated with identity documents (C=Y; v1 N)."
        legal_basis: "ECOA 15 U.S.C. 1691(a)(1); Reg B 12 CFR 1002.2(z), 1002.6(b)(2); Reg C 12 CFR 1003.4(a)(10)(ii)"
        review_status: "reviewed by the authors"
      co_applicant_age:
        plain_meaning: co_applicant_age_band
        mutability: I
        verifiability: "Y"
        correctability: "Y"
        sensitivity: S
        principal_reason: Low
        rationale: "Co-applicant age band: a prohibited basis under ECOA for all credit, including mortgages, although age is not a Fair Housing Act protected class (S=S); known to the applicants (V=Y), not actionable (M=I), and computed from the stated date of birth, which can be restated with identity documents (C=Y; v1 N)."
        legal_basis: "ECOA 15 U.S.C. 1691(a)(1); Reg B 12 CFR 1002.2(z), 1002.6(b)(2); Reg C 12 CFR 1003.4(a)(10)(ii)"
        review_status: "reviewed by the authors"
      derived_race:
        plain_meaning: derived_race_category
        mutability: I
        verifiability: P
        correctability: P
        sensitivity: S
        principal_reason: Low
        rationale: "FFIEC-derived race category combining applicant and co-applicant entries, which the lender may record from visual observation or surname when the applicant declines to provide it, so the applicant can confirm the recorded value only from the lender's record (V=P) and a misrecording is corrected at the lender's discretion (C=P); a protected class under the Fair Housing Act and ECOA (S=S); immutable (M=I)."
        legal_basis: "FHA 42 U.S.C. 3605; ECOA 15 U.S.C. 1691(a)(1); Reg C 12 CFR 1003.4(a)(10)(i); Reg B 12 CFR 1002.13"
        review_status: "reviewed by the authors"
      derived_ethnicity:
        plain_meaning: derived_ethnicity_category
        mutability: I
        verifiability: P
        correctability: P
        sensitivity: S
        principal_reason: Low
        rationale: "FFIEC-derived ethnicity (Hispanic or Latino) category combining applicant and co-applicant entries, which the lender may record from visual observation or surname when the applicant declines to provide it, so the applicant can confirm the recorded value only from the lender's record (V=P) and a misrecording is corrected at the lender's discretion (C=P); ethnicity corresponds to national origin, a protected class under the Fair Housing Act and ECOA (S=S); immutable (M=I)."
        legal_basis: "FHA 42 U.S.C. 3605; ECOA 15 U.S.C. 1691(a)(1); Reg C 12 CFR 1003.4(a)(10)(i); Reg B 12 CFR 1002.13"
        review_status: "reviewed by the authors"
      derived_sex:
        plain_meaning: derived_sex_category
        mutability: I
        verifiability: P
        correctability: P
        sensitivity: S
        principal_reason: Low
        rationale: "FFIEC-derived sex category collected the same way as race and ethnicity, including from visual observation or surname when the applicant declines, so the applicant can confirm the recorded value only from the lender's record (V=P; v1 Y) and a misrecording is corrected at the lender's discretion (C=P; v1 N); a protected class under the Fair Housing Act and ECOA (S=S); immutable (M=I)."
        legal_basis: "FHA 42 U.S.C. 3605; ECOA 15 U.S.C. 1691(a)(1); Reg C 12 CFR 1003.4(a)(10)(i); Reg B 12 CFR 1002.13"
        review_status: "reviewed by the authors"
      state_code:
        plain_meaning: state_code
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Low
        rationale: "State of the property, known from the applicant's address (V=Y); a misrecorded state is corrected by restating the property address (C=Y; v1 N); geography is a recognized proxy for race and national origin (redlining), labeled P (S=P) and now kept in the primary track to be analyzed; moving is not a legitimate recourse action (M=N)."
