  give_me_some_credit:
    target: FinancialDistressNextTwoYears
    target_positive_label: "No"
    target_negative_label: "Yes"
    legal_regime: "US consumer borrowers (Kaggle Give Me Some Credit data); a mix of consumer-report and self-reported features. ECOA/Reg B and the FCRA apply."
    primary_track_excluded_features:
      - age
    audit_track_excluded_features: []
    features:
      RevolvingUtilizationOfUnsecuredLines:
        plain_meaning: revolving_utilization_of_unsecured_lines
        mutability: M
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived ratio of card and personal-line balances to their limits: the value used is the bureau-recorded one, checkable only from the consumer report (V=P; v1 Y), and errors in reported balances or limits are disputable (C=Y; v1 P); credit behavior (S=N) that paying down balances changes (M=M)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      age:
        plain_meaning: age_years
        mutability: I
        verifiability: "Y"
        correctability: "Y"
        sensitivity: S
        principal_reason: Low
        rationale: "Self-reported age in years: a prohibited basis under ECOA that Reg B permits in an empirically derived system only if elderly applicants are not disfavored (S=S); known to the applicant (V=Y), not actionable (M=I), and a misrecorded age can be restated with identity documents (C=Y; v1 N)."
        legal_basis: "ECOA 15 U.S.C. 1691(a)(1); Reg B 12 CFR 1002.2(z), 1002.6(b)(2)"
        review_status: "reviewed by the authors"
      NumberOfTime30-59DaysPastDueNotWorse:
        plain_meaning: count_of_30_to_59_day_past_due_events
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived count of 30-59-day late payments in the last two years: checkable only from the consumer report (V=P; v1 Y) and disputable with the bureau or furnisher (C=Y); credit performance (S=N) that changes only as the window moves (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      DebtRatio:
        plain_meaning: debt_ratio
        mutability: M
        verifiability: P
        correctability: P
        sensitivity: "N"
        principal_reason: High
        rationale: "Ratio of monthly debt payments, alimony and living costs to income, computed by the lender from bureau-reported obligations and self-reported figures, so the applicant can check it only with the lender's and bureau's records (V=P; v1 Y); the inputs can be documented or disputed, but the computation is the lender's, so correcting the ratio itself depends on the lender (C=P); not a personal characteristic or proxy (S=N); paying down debt lowers it (M=M)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i (reported obligations)"
        review_status: "reviewed by the authors"
      MonthlyIncome:
        plain_meaning: monthly_income
        mutability: PL
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Medium
        rationale: "Self-reported monthly income that the applicant can document with pay or tax records (V=Y) and restate with that documentation (C=Y; v1 P); income level is a legitimate factor, but Reg B protects public-assistance income and restricts discounting income by source, so it is labeled socially sensitive (S=P); it changes only with employment over time (M=PL)."
        legal_basis: "ECOA 15 U.S.C. 1691(a)(2); Reg B 12 CFR 1002.6(b)(5)"
        review_status: "reviewed by the authors"
      NumberOfOpenCreditLinesAndLoans:
        plain_meaning: number_of_open_credit_lines_and_loans
        mutability: PS
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Bureau-derived count of open loans and credit lines: checkable only from the consumer report (V=P; v1 Y) and disputable (C=Y; v1 P); credit behavior (S=N) that changes as accounts are opened or closed (M=PS)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumberOfTimes90DaysLate:
        plain_meaning: count_of_90_day_late_events
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived count of 90-plus-day late payments: checkable only from the consumer report (V=P; v1 Y) and disputable with the bureau or furnisher (C=Y); credit performance (S=N) that changes only as entries age off the report (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i, 1681c(a) (reporting period for adverse items)"
        review_status: "reviewed by the authors"
      NumberRealEstateLoansOrLines:
        plain_meaning: number_of_real_estate_loans_or_lines
        mutability: P
        verifiability: P
        correctability: "Y"
        sensitivity: P
        principal_reason: Medium
        rationale: "Bureau-derived count of mortgage and home-equity accounts: checkable only from the consumer report (V=P; v1 Y) and disputable (C=Y; v1 P); it signals home ownership and wealth, a socioeconomic indicator (S=P), and changes mainly through lender-structured transactions (M=P)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumberOfTime60-89DaysPastDueNotWorse:
        plain_meaning: count_of_60_to_89_day_past_due_events
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived count of 60-89-day late payments in the last two years: checkable only from the consumer report (V=P; v1 Y) and disputable with the bureau or furnisher (C=Y); credit performance (S=N) that changes only as the window moves (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumberOfDependents:
        plain_meaning: number_of_dependents
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Low
        rationale: "Self-reported number of dependents that the applicant can document (V=Y) and restate (C=Y; v1 P); creditors may ask about dependents but may not make childbearing assumptions, and the count tracks marital and familial status, so it is labeled a proxy (S=P) and now stays in the primary track; it is not a legitimate recourse action (M=N; v1 PS)."
        legal_basis: "Reg B 12 CFR 1002.5(d)(3), 1002.6(b)(3)"
        review_status: "reviewed by the authors"

  south_german_credit:
    target: credit_risk
    target_positive_label: good
    target_negative_label: bad
    legal_regime: "German consumer credit, 1973-1975 (Groemping's corrected South German Credit data). Labels apply the US framework (ECOA/Reg B, FCRA) by analogy as the benchmark's reference regime; they do not describe the law that governed the original decisions."
    primary_track_excluded_features:
      - personal_status_sex
      - age
    audit_track_excluded_features: []
    features:
      status:
        plain_meaning: checking_account_status
        mutability: M
        verifiability: "Y"
        correctability: P
        sensitivity: P
        principal_reason: Medium
        rationale: "Checking-account status at the lending bank, visible on the applicant's own account statements (V=Y) but recorded by the bank, which corrects it at its discretion (C=P); having no account or a negative balance is a wealth signal associated with being unbanked, so it is labeled socially sensitive (S=P); balances can be changed (M=M)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      duration:
        plain_meaning: credit_duration_months
        mutability: P
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Requested loan term in months, stated in the application (V=Y) and restatable by the applicant (C=Y; v1 P); chosen within the terms the lender offers (M=P); a loan term, not a personal characteristic (S=N)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      credit_history:
        plain_meaning: prior_credit_compliance_history
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Prior repayment compliance drawn from the bank's records and credit-bureau data, which the applicant can check only by obtaining those records (V=P; v1 Y); bureau entries are disputable under the US analogue (C=Y); credit performance (S=N) that changes only as new history accrues (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i (US analogue)"
        review_status: "reviewed by the authors"
      purpose:
        plain_meaning: purpose_of_credit
        mutability: P
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Low
        rationale: "Stated purpose of the credit, part of the application (V=Y) and restatable (C=Y; v1 P); a transaction characteristic, not a protected characteristic or recognized proxy (S=N; v1 P); fixed largely by the applicant's need (M=P)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      amount:
        plain_meaning: credit_amount
        mutability: M
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Requested credit amount, stated in the application (V=Y) and restatable (C=Y; v1 P); the manuscript's example of a feature mutable at low cost (M=M); a loan term (S=N)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      savings:
        plain_meaning: savings_status
        mutability: M
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Medium
        rationale: "Savings category that the applicant can document with their own statements (V=Y) and restate (C=Y; v1 P); a wealth indicator, labeled socially sensitive (S=P); it changes by saving (M=M)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      employment_duration:
        plain_meaning: employment_duration
        mutability: PL
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Medium
        rationale: "Self-reported length of current employment, documentable (V=Y) and restatable (C=Y; v1 P); it accrues with the applicant's age, a prohibited basis, so it is labeled an age proxy (S=P); it changes only over years (M=PL)."
        legal_basis: "Reg B 12 CFR 1002.2(z) (age is a prohibited basis; the proxy label is set in the authors' review)"
        review_status: "reviewed by the authors"
      installment_rate:
        plain_meaning: installment_burden_relative_to_income
        mutability: M
        verifiability: "Y"
        correctability: P
        sensitivity: "N"
        principal_reason: High
        rationale: "Installment as a share of disposable income, which the applicant can approximate from their own income and the requested terms (V=Y); the disposable-income assessment is the lender's, so correcting the ratio itself depends on the lender (C=P); not a personal characteristic (S=N); it changes with the requested amount or term (M=M)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      personal_status_sex:
        plain_meaning: combined_sex_and_marital_status_code
        mutability: I
        verifiability: "Y"
        correctability: "Y"
        sensitivity: S
        principal_reason: Low
        rationale: "Combined sex and marital-status code built from facts the applicant states (V=Y; v1 P); it directly encodes two prohibited bases (S=S) and is treated as immutable because its sex component cannot change (M=I); a misrecorded code can be restated by the applicant with documentation (C=Y; v1 N)."
        legal_basis: "ECOA 15 U.S.C. 1691(a)(1); Reg B 12 CFR 1002.2(z)"
        review_status: "reviewed by the authors"
      other_debtors:
        plain_meaning: co_applicant_or_guarantor_status
        mutability: P
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Whether a co-applicant or guarantor is attached, stated in the application (V=Y) and restatable (C=Y; v1 P); lender-structured (M=P); not a personal characteristic (S=N)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      present_residence:
        plain_meaning: years_at_current_residence
        mutability: PL
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Medium
        rationale: "Self-reported years at the current residence, documentable (V=Y) and restatable (C=Y; v1 P); it accrues with age, so it is labeled an age proxy (S=P); it changes only over years (M=PL)."
        legal_basis: "Reg B 12 CFR 1002.2(z) (age is a prohibited basis; the proxy label is set in the authors' review)"
        review_status: "reviewed by the authors"
      property:
        plain_meaning: most_valuable_property_category
        mutability: PL
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Low
        rationale: "Most valuable property category (for example, real estate, a building-society savings contract or a car), documentable by the applicant (V=Y) and restatable (C=Y; v1 P); a wealth indicator, labeled socially sensitive (S=P); it changes slowly (M=PL)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      age:
        plain_meaning: age_years
        mutability: I
        verifiability: "Y"
        correctability: "Y"
        sensitivity: S
        principal_reason: Low
        rationale: "Self-reported age: a prohibited basis under ECOA that Reg B permits in an empirically derived system only if elderly applicants are not disfavored (S=S), so it is now excluded from the primary track (v1 kept it); known to the applicant (V=Y), not actionable (M=I), and a misrecorded age can be restated with identity documents (C=Y; v1 N)."
        legal_basis: "ECOA 15 U.S.C. 1691(a)(1); Reg B 12 CFR 1002.2(z), 1002.6(b)(2)"
        review_status: "reviewed by the authors"
      other_installment_plans:
        plain_meaning: other_installment_plans
        mutability: M
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Installment plans with other banks or stores, for which the applicant holds the agreements (V=Y) and which the applicant can restate (C=Y; v1 P); credit behavior (S=N) that repayment changes (M=M)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      housing:
        plain_meaning: housing_type
        mutability: PL
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Low
        rationale: "Housing tenure (rent, own, or free), stated and documentable by the applicant (V=Y) and restatable (C=Y; v1 P); a socioeconomic indicator, labeled socially sensitive (S=P); it changes only over years (M=PL)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      number_credits:
        plain_meaning: number_of_credits_at_this_bank
        mutability: PS
        verifiability: "Y"
        correctability: P
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Number of existing credits at this bank: the applicant holds the loan agreements (V=Y), but the record is the bank's own and is corrected at its discretion (C=P); credit behavior (S=N) that changes as loans are repaid or opened (M=PS)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      job:
        plain_meaning: job_quality_category
        mutability: PL
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Low
        rationale: "Self-reported occupation and skill category, documentable (V=Y) and restatable (C=Y; v1 P); a socioeconomic indicator, labeled socially sensitive (S=P); it changes only over years (M=PL)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      people_liable:
        plain_meaning: number_of_dependents
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Low
        rationale: "Number of people financially dependent on the applicant, documentable (V=Y) and restatable (C=Y; v1 P); it tracks marital and familial status, so it is labeled a proxy (S=P), and it is not a legitimate recourse action (M=N; v1 PS)."
        legal_basis: "Reg B 12 CFR 1002.5(d)(3), 1002.6(b)(3)"
        review_status: "reviewed by the authors"
      telephone:
        plain_meaning: telephone_landline_status
        mutability: PL
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Low
        rationale: "Whether a telephone is registered in the applicant's name, which the applicant can document (V=Y) and restate (C=Y; v1 P); Reg B bars considering a telephone listing in the applicant's name for consumer credit, so it is labeled a restricted socioeconomic signal (S=P), and because it is not a prohibited basis it stays in the primary track under the one-rule policy (flagged for the authors); M=PL is kept from v1."
        legal_basis: "Reg B 12 CFR 1002.6(b)(4)"
        review_status: "reviewed by the authors"
      foreign_worker:
        plain_meaning: foreign_worker_indicator
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Low
        rationale: "Whether the applicant is a foreign worker, which the applicant can document (V=Y) and restate (C=Y; v1 P); immigration or residency status is not itself a prohibited basis and Reg B lets creditors consider it, but it closely tracks national origin, so it is labeled a strong proxy (S=P; v1 S) and now stays in the primary track (authors should confirm, and revert to S if it is treated as a direct encoding of national origin); it is neither an intrinsic characteristic nor a legitimate recourse action (M=N; v1 I)."
        legal_basis: "Reg B 12 CFR 1002.6(b)(7) (immigration status may be considered); ECOA 15 U.S.C. 1691(a)(1) (national origin)"
        review_status: "reviewed by the authors"

