        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Issuer-recorded repayment status for August 2005, reconstructable from the cardholder's own monthly statements (V=Y) and contestable as a billing error or through a direct dispute with the furnisher (C=Y, US analogue); credit behavior (S=N) that on-time payment improves going forward (M=PS)."
        legal_basis: "FCBA 15 U.S.C. 1666; Reg Z 12 CFR 1026.13; FCRA 15 U.S.C. 1681s-2(a)(8) (US analogue)"
        review_status: "reviewed by the authors"
      PAY_3:
