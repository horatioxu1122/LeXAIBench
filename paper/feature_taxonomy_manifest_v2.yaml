# LeXAIBench feature taxonomy manifest.
# Generated by benchmark/cslaw/validate_taxonomy.py --write-yaml from
#   taxonomy: benchmark/metadata/feature_taxonomy_v2.json
#   registry: benchmark/metadata/dataset_registry_v2.json
# The JSON files are the machine-read source; this manifest documents them.
# The labeling rules and every change from v1:
# benchmark/metadata/TAXONOMY_V2_CHANGES.md.
taxonomy_version: v2
status: "reviewed by the authors. Changes from v1: benchmark/metadata/TAXONOMY_V2_CHANGES.md. Validate with benchmark/cslaw/validate_taxonomy.py."

taxonomy_definitions:
  mutability:
    I: "immutable personal characteristic (e.g., age, sex, race); never a recourse target"
    PS: "changes through the subject's behavior over the short or medium term (path-dependent)"
    PL: "changes through the subject's behavior only over the long term (path-dependent; e.g., income, credit-history length)"
    M: "directly or moderately mutable by the subject at low cost (e.g., balances, requested loan amount)"
    P: "partially mutable: set jointly with, or structured by, the institution (e.g., loan type, credit limit, lien status)"
    "N": "not actionable by the subject: fixed institutional or historical facts, and characteristics that may change in fact but are never legitimate recourse (e.g., location, charges, marital status)"
  verifiability:
    "Y": "the subject can check the value from documents they hold (application, own account statements, pay records, charging instrument, identity documents)"
    P: "the subject can check the value only by obtaining institutional or third-party records (consumer report under FCRA 15 U.S.C. 1681g, lender or agency records, geocoding records), including values the institution computes from such records"
    "N": "the subject cannot check the value even when told it (proprietary scores, model-derived values)"
  correctability:
    "Y": "an erroneous recorded value can be corrected through a channel the subject can invoke: documentation or restatement for subject-supplied data (including self-stated personal characteristics such as age and sex, and the property address); FCRA dispute (15 U.S.C. 1681i) for consumer-report data; billing-error dispute (15 U.S.C. 1666) for card-account data; motion practice or record review for charges and criminal history"
    P: "an erroneous recorded value can be corrected only at the institution's discretion or only indirectly (institution-recorded, -observed, -set, -assigned or -computed values, including geocodes, agency records and institutional assignments; proprietary scores through their inputs)"
    "N": "no channel exists to correct an erroneous recorded value, not even at the institution's discretion (e.g., a model-derived value with no dispute path). Correctability asks only whether an error can be corrected; whether an accurately recorded value can change is mutability"
  sensitivity:
    S: "protected-class characteristic under the domain's governing law, or its direct encoding (credit: ECOA/Reg B prohibited bases, 15 U.S.C. 1691(a), 12 CFR 1002.2(z); mortgage: also FHA 42 U.S.C. 3605; pretrial: equal-protection suspect or quasi-suspect classes; regulated firms: none)"
    P: "plausible proxy for a protected characteristic (geography, household composition, immigration status, tenure that accrues with age) or a socially sensitive attribute of the subject's circumstances (income, wealth, education, occupation, housing tenure, restricted factors such as a telephone listing)"
    "N": "neither; includes credit performance, loan and account terms, and charge or case facts"
  principal_reason:
    High: "usually suitable as a specific adverse-action principal reason"
    Medium: "usable with translation or care"
    Low: "should usually not be used directly as a principal reason (v2 keeps the v1 principal-reason labels unchanged)"

track_policy:
  version: v2
  rule: "The primary track excludes exactly the taxonomy features labeled sensitivity S (protected-class characteristics under the domain's governing law, or their direct encodings). Proxy (P) and non-sensitive (N) features stay in the primary track, where proxy effects are analyzed rather than assumed away. The audit track excludes no taxonomy feature. Non-taxonomy identifier columns are excluded from both tracks."
  primary_track_excluded_sensitivity:
    - S
  audit_track_excluded_sensitivity: []
  identifier_columns:
    default_of_credit_card_clients:
      - ID
  list_order: "identifier columns first, then excluded taxonomy features in taxonomy order"
  taxonomy: "benchmark/metadata/feature_taxonomy_v2.json"
  validator: "benchmark/cslaw/validate_taxonomy.py"
  changes: "benchmark/metadata/TAXONOMY_V2_CHANGES.md"
  review_status: "reviewed by the authors"

datasets:
  heloc:
    target: RiskPerformance
    target_positive_label: Good
    target_negative_label: Bad
    legal_regime: "US home-equity line of credit applications (FICO explainable-ML challenge data); all features are derived from consumer-report data. ECOA/Reg B adverse-action rules and the FCRA apply."
    primary_track_excluded_features: []
    audit_track_excluded_features: []
    features:
      ExternalRiskEstimate:
        plain_meaning: external_bureau_style_risk_estimate
        mutability: "N"
        verifiability: "N"
        correctability: P
        sensitivity: "N"
        principal_reason: Low
        rationale: "Proprietary consolidated risk score: the applicant may be told a score but cannot recompute or check it (V=N; v1 P) and can correct it only indirectly by disputing the bureau entries it is built from (C=P); it summarizes credit performance and is not a protected characteristic or recognized proxy (S=N; v1 P), cannot be acted on directly (M=N), and a failed score is not by itself a specific adverse-action reason (PR=Low)."
        legal_basis: "Reg B 12 CFR 1002.9(b)(2) (failing the qualifying score of the creditor's own system is an insufficient reason; whether naming a bureau score used as an input is specific enough is open); FCRA 15 U.S.C. 1681g(f) (disclosure of the credit score), 1681i (dispute of underlying data)"
        review_status: "reviewed by the authors"
      MSinceOldestTradeOpen:
        plain_meaning: months_since_oldest_trade_open
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: P
        principal_reason: Medium
        rationale: "Bureau-derived age of the oldest account: the applicant can check it only by obtaining the consumer report (V=P; v1 Y) and can dispute errors in the underlying tradeline (C=Y; v1 P); it grows only with time (M=PL), and because credit-history length accrues with the applicant's age, a prohibited basis, it is labeled an age proxy (S=P; v1 N)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i; Reg B 12 CFR 1002.2(z) (age is a prohibited basis; the proxy label is set in the authors' review)"
        review_status: "reviewed by the authors"
      MSinceMostRecentTradeOpen:
        plain_meaning: months_since_most_recent_trade_open
        mutability: PS
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Bureau-derived months since the newest account opened: checkable only from the consumer report (V=P; v1 Y) and disputable through the underlying tradeline (C=Y; v1 P); a credit-behavior measure, not a protected characteristic or proxy (S=N), that rises as time passes without new accounts (M=PS)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      AverageMInFile:
        plain_meaning: average_months_in_file
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: P
        principal_reason: Medium
        rationale: "Bureau-derived average account age: checkable only from the consumer report (V=P) and disputable through the underlying tradelines (C=Y; v1 P); it grows only with time (M=PL) and accrues with the applicant's age, so it is labeled an age proxy like the oldest-account age (S=P; v1 N)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i; Reg B 12 CFR 1002.2(z) (age is a prohibited basis; the proxy label is set in the authors' review)"
        review_status: "reviewed by the authors"
      NumSatisfactoryTrades:
        plain_meaning: number_of_satisfactory_trades
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived count of accounts in good standing: checkable only from the consumer report (V=P; v1 Y) and disputable through the underlying tradelines (C=Y; v1 P); credit performance rather than a protected characteristic or proxy (S=N), changing only as history accrues (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumTrades60Ever2DerogPubRec:
        plain_meaning: number_of_60_plus_day_delinquencies_or_public_records
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived count of accounts ever 60 or more days delinquent or with a derogatory public record: checkable only from the consumer report (V=P; v1 Y) and disputable with the bureau or furnisher (C=Y); credit performance (S=N) that changes only as entries age off the report (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i, 1681c(a) (reporting period for adverse items)"
        review_status: "reviewed by the authors"
      NumTrades90Ever2DerogPubRec:
        plain_meaning: number_of_90_plus_day_delinquencies_or_public_records
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived count of accounts ever 90 or more days delinquent or with a derogatory public record: checkable only from the consumer report (V=P; v1 Y) and disputable with the bureau or furnisher (C=Y); credit performance (S=N) that changes only as entries age off the report (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i, 1681c(a) (reporting period for adverse items)"
        review_status: "reviewed by the authors"
      PercentTradesNeverDelq:
        plain_meaning: percent_of_trades_never_delinquent
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived share of accounts never delinquent: checkable only from the consumer report (V=P; v1 Y) and recomputed when disputed tradelines are corrected (C=Y; v1 P); credit performance (S=N) that improves only as history accrues (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      MSinceMostRecentDelq:
        plain_meaning: months_since_most_recent_delinquency
        mutability: PS
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived months since the latest delinquency: checkable only from the consumer report (V=P; v1 Y) and disputable (C=Y); credit performance (S=N) that rises with each month without a new delinquency (M=PS)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      MaxDelq2PublicRecLast12M:
        plain_meaning: worst_delinquency_or_public_record_in_last_12_months
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived worst delinquency or public record in the last 12 months: checkable only from the consumer report (V=P; v1 Y) and disputable (C=Y); credit performance (S=N) that changes only as the 12-month window moves (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      MaxDelqEver:
        plain_meaning: worst_delinquency_ever
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Bureau-derived worst delinquency ever: checkable only from the consumer report (V=P; v1 Y) and disputable (C=Y); credit performance (S=N) that changes only when entries age off the report (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i, 1681c(a) (reporting period for adverse items)"
        review_status: "reviewed by the authors"
      NumTotalTrades:
        plain_meaning: number_of_total_trades
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Bureau-derived count of all accounts: checkable only from the consumer report (V=P; v1 Y) and disputable through the underlying tradelines (C=Y; v1 P); a credit-file measure, not a protected characteristic or proxy (S=N), that changes slowly (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumTradesOpeninLast12M:
        plain_meaning: number_of_trades_opened_in_last_12_months
        mutability: PS
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Bureau-derived count of accounts opened in the last 12 months: checkable only from the consumer report (V=P; v1 Y) and disputable (C=Y; v1 P); credit behavior (S=N) that falls as the window moves if no accounts are opened (M=PS)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      PercentInstallTrades:
        plain_meaning: percent_installment_trades
        mutability: PL
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Low
        rationale: "Bureau-derived share of installment accounts: checkable only from the consumer report (V=P; v1 Y) and recomputed when disputed tradelines are corrected (C=Y; v1 P); a credit-mix measure (S=N) that changes slowly (M=PL)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      MSinceMostRecentInqexcl7days:
        plain_meaning: months_since_recent_inquiry_excluding_last_week
        mutability: PS
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Bureau-derived months since the latest credit inquiry: checkable only from the consumer report (V=P; v1 Y), and an inquiry made without a permissible purpose can be disputed (C=Y; v1 P); credit behavior (S=N) that rises without new applications (M=PS)."
        legal_basis: "FCRA 15 U.S.C. 1681b (permissible purpose), 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumInqLast6M:
        plain_meaning: number_of_inquiries_last_6_months
        mutability: PS
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived count of credit inquiries in the last six months: checkable only from the consumer report (V=P; v1 Y), and inquiries without a permissible purpose can be disputed (C=Y); credit behavior (S=N) that falls as the window moves (M=PS)."
        legal_basis: "FCRA 15 U.S.C. 1681b (permissible purpose), 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumInqLast6Mexcl7days:
        plain_meaning: number_of_inquiries_last_6_months_excluding_last_week
        mutability: PS
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Bureau-derived count of credit inquiries in the last six months excluding the last seven days: checkable only from the consumer report (V=P; v1 Y), and inquiries without a permissible purpose can be disputed (C=Y); credit behavior (S=N) that falls as the window moves (M=PS)."
        legal_basis: "FCRA 15 U.S.C. 1681b (permissible purpose), 1681g, 1681i"
        review_status: "reviewed by the authors"
      NetFractionRevolvingBurden:
        plain_meaning: revolving_balance_relative_to_limit
        mutability: M
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived revolving balance relative to credit limits: the applicant's own statements show balances, but the value used is the bureau-recorded one, checkable only from the consumer report (V=P; v1 Y), and errors in reported balances or limits are disputable (C=Y; v1 P); credit behavior (S=N) that paying down balances changes (M=M)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      NetFractionInstallBurden:
        plain_meaning: installment_balance_relative_to_original_loan_amount
        mutability: M
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived installment balance relative to original loan amounts: checkable only from the consumer report (V=P; v1 Y) and disputable through the underlying tradelines (C=Y; v1 P); credit behavior (S=N) that falls with repayment (M=M)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumRevolvingTradesWBalance:
        plain_meaning: number_of_revolving_trades_with_balance
        mutability: M
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Bureau-derived count of revolving accounts carrying a balance: checkable only from the consumer report (V=P; v1 Y) and disputable (C=Y; v1 P); credit behavior (S=N) that paying balances off changes (M=M)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumInstallTradesWBalance:
        plain_meaning: number_of_installment_trades_with_balance
        mutability: PS
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Bureau-derived count of installment accounts carrying a balance: checkable only from the consumer report (V=P; v1 Y) and disputable (C=Y; v1 P); credit behavior (S=N) that changes as loans are repaid (M=PS)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      NumBank2NatlTradesWHighUtilization:
        plain_meaning: number_of_bank_or_national_trades_with_high_utilization
        mutability: M
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived count of bank or national cards with high utilization: checkable only from the consumer report (V=P; v1 Y) and disputable (C=Y; v1 P); credit behavior (S=N) that paying down balances changes (M=M)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"
      PercentTradesWBalance:
        plain_meaning: percent_of_trades_with_balance
        mutability: M
        verifiability: P
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Bureau-derived share of accounts carrying a balance: checkable only from the consumer report (V=P; v1 Y) and recomputed when disputed tradelines are corrected (C=Y; v1 P); credit behavior (S=N) that paying balances off changes (M=M)."
        legal_basis: "FCRA 15 U.S.C. 1681g, 1681i"
        review_status: "reviewed by the authors"

  default_of_credit_card_clients:
    target: default_payment_next_month
    target_positive_label: "0"
    target_negative_label: "1"
    legal_regime: "Taiwanese credit-card accounts, April-September 2005. Labels apply the US framework (ECOA/Reg B, FCRA, FCBA/Reg Z) by analogy as the benchmark's reference regime; they do not describe the law that governed the original decisions."
    primary_track_excluded_features:
      - ID
      - SEX
      - MARRIAGE
      - AGE
    audit_track_excluded_features:
      - ID
    features:
      LIMIT_BAL:
        plain_meaning: credit_limit
        mutability: P
        verifiability: "Y"
        correctability: P
        sensitivity: "N"
        principal_reason: Medium
        rationale: "Issuer-assigned credit limit printed on the cardholder's own statements (V=Y); the issuer sets and changes it at its discretion (C=P, M=P); an account term rather than a personal characteristic or recognized proxy (S=N; v1 P, which treated it as an income signal)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      SEX:
        plain_meaning: sex
        mutability: I
        verifiability: "Y"
        correctability: "Y"
        sensitivity: S
        principal_reason: Low
        rationale: "Self-reported sex: a prohibited basis under ECOA (S=S) and immutable for recourse (M=I); the applicant knows the value (V=Y), and a misrecorded value can be restated with identity documents (C=Y; v1 N), as for MARRIAGE and EDUCATION."
        legal_basis: "ECOA 15 U.S.C. 1691(a)(1); Reg B 12 CFR 1002.2(z)"
        review_status: "reviewed by the authors"
      EDUCATION:
        plain_meaning: education_level
        mutability: PL
        verifiability: "Y"
        correctability: "Y"
        sensitivity: P
        principal_reason: Low
        rationale: "Self-reported education level that the applicant can document (V=Y) and restate with documentation (C=Y; v1 P); not a prohibited basis but a socioeconomic indicator correlated with national origin and age (S=P), so it now stays in the primary track; it changes only over years (M=PL)."
        legal_basis: "set in the authors' review"
        review_status: "reviewed by the authors"
      MARRIAGE:
        plain_meaning: marital_status
        mutability: "N"
        verifiability: "Y"
        correctability: "Y"
        sensitivity: S
        principal_reason: Low
        rationale: "Self-reported marital status, a prohibited basis under ECOA (S=S); the applicant can document and restate it (V=Y; C=Y, v1 P), and because it can change in fact but is never a legitimate recourse target it is coded not actionable rather than immutable (M=N; v1 I)."
        legal_basis: "ECOA 15 U.S.C. 1691(a)(1); Reg B 12 CFR 1002.2(z), 1002.6(b)(8)"
        review_status: "reviewed by the authors"
      AGE:
        plain_meaning: age
        mutability: I
        verifiability: "Y"
        correctability: "Y"
        sensitivity: S
        principal_reason: Low
        rationale: "Self-reported age: a prohibited basis under ECOA that Reg B permits in an empirically derived system only if elderly applicants are not disfavored (S=S); the applicant knows it (V=Y), it is not actionable (M=I), and a misrecorded age can be restated with identity documents (C=Y; v1 N)."
        legal_basis: "ECOA 15 U.S.C. 1691(a)(1); Reg B 12 CFR 1002.2(z), 1002.6(b)(2)"
        review_status: "reviewed by the authors"
      PAY_0:
        plain_meaning: repayment_status_september_2005
        mutability: PS
        verifiability: "Y"
        correctability: "Y"
        sensitivity: "N"
        principal_reason: High
        rationale: "Issuer-recorded repayment status for September 2005, reconstructable from the cardholder's own monthly statements (V=Y) and contestable as a billing error or through a direct dispute with the furnisher (C=Y, US analogue); credit behavior (S=N) that on-time payment improves going forward (M=PS)."
        legal_basis: "FCBA 15 U.S.C. 1666; Reg Z 12 CFR 1026.13; FCRA 15 U.S.C. 1681s-2(a)(8) (US analogue)"
        review_status: "reviewed by the authors"
      PAY_2:
